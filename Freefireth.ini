[General]
enable = true
mode = head
fov = 120
smoothness = 0.35
smoothness_swipe = 0.55
max_distance = 300
min_distance = 5
prediction_time = 0.08
auto_switch = true
switch_delay = 0.3
keep_angle_no_target = true
no_target_wait = 0.5

[Target]
[Target.Head]
enable = true
offset_x = 0
offset_y = 0.15
offset_z = 0
accuracy = 1.0
priority = 1.0

[Target.Chest]
enable = false
offset_x = 0
offset_y = 0
offset_z = 0
accuracy = 0.8
priority = 0.5

[Target.Leg]
enable = false
offset_x = 0
offset_y = -0.5
offset_z = 0
accuracy = 0.6
priority = 0.3

[Priority]
; Loai uu tien: distance, fov, health, moving
type = distance
distance_weight = 1.0
fov_weight = 0.9
health_weight = 0.5
moving_weight = 0.7

[Bullet]
; Cau hinh duong dan dan
accuracy = 1.0
spread = 0.0
error = 0.0
deviation = 0.0
speed = 1.5
max_distance = 500
gravity_compensation = 0.1

[Memory]
; Dia chi bo nho (can cap nhat theo phien ban game)
camera_angle = 0x7F8A4C08
player_position = 0x7F8A4C00
enemy_list = 0x7F8A4D00
target_angle = 0x7F8A4C10
smoothness_addr = 0x7F8A4C14
aimlock_status = 0x7F8A4C18
current_target = 0x7F8A4C1C
current_fov = 0x7F8A4C20
head_offset = 0x10
player_list = 0x7F8A4D10
health_addr = 0x7F8A4D20

[Hotkey]
toggle_aimlock
switch_target 
toggle_fov 
toggle_bullet 
reload_config
increase_smooth
decrease_smooth

[Optimize]
reduce_graphics = true
increase_fps = true
reduce_shake = true
smoothness_level = 1.0
reduce_lag = true
gpu_rendering = true
hardware_acceleration = true
target_fps = 120
render_scale = 0.75

[Device]
type = android
cpu_cores = 8
ram_size = 4096
gpu_type = adreno
refresh_rate = 120
resolution = 1080x2400

[Visual]
show_fov = true
show_target = true
show_crosshair = true
crosshair_color = #00FF00
fov_color = #FF0000
target_color = #FFFF00
fov_alpha = 0.3
target_size = 0.5
crosshair_size = 20

[Log]
enable = true
path = /sdcard/aimlock_log.txt
log_target = true
log_position = true
log_time = true
log_fps = true
log_memory = true
max_size = 1048576
log_level = info

[Warning]
description = This configuration is for educational purposes only
risk = Account ban if used on official servers
recommendation = Use only in training mode or private servers
version = 3.0.0
author = palofsc
[Advanced]
use_prediction = true
smooth_on_swipe = true
headshot_only = false
ignore_down = true
ignore_bot = true
fov_check = true
distance_check = true
line_of_sight = true
use_gyro = false
gyro_sensitivity = 50
